name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: game test
        id: gametest
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils > /dev/null
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log
      - name: save log
        if: always()
        run: |
          mkdir -p /tmp/gt/shots
          [ -f gametest.log ] && grep -E -A3 "error:|ERROR|Exception|FAIL|Caused by|at com.seolwoni|AssertionError|What went wrong|^> " gametest.log | head -300 > /tmp/gt/gt-errors.txt || true
          [ -f gametest.log ] && tail -200 gametest.log > /tmp/gt/gt-tail.txt || true
          find . -name "*-test-result.txt" -not -path "./.git/*" -exec cp {} /tmp/gt/ \; 2>/dev/null || true
          find . -name "*.png" -path "*screenshots*" -not -path "./.git/*" -exec cp {} /tmp/gt/shots/ \; 2>/dev/null || true
          LOG=$(find . -name "latest.log" -path "*run*" -not -path "./.git/*" | head -1); [ -n "$LOG" ] && tail -400 "$LOG" > /tmp/gt/gt-latest.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          grep -E "error:|warning:|\.java:[0-9]+|What went wrong|^> |Caused by|Exception" build.log | head -400 > /tmp/errors.txt || true
          grep -A6 "error:" build.log | head -300 > /tmp/compile.txt || true
          tail -300 build.log > /tmp/tail.txt
          JAR=$(find ~/.gradle .gradle -name "minecraft-merged.jar" 2>/dev/null | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -name "minecraft-*.jar" -size +5M 2>/dev/null | grep -v sources | head -1)
          echo "jar: $JAR" > /tmp/sigs.txt
          for c in $(cat .github/sigs.txt); do
            javap -p -cp "$JAR" $c >> /tmp/sigs.txt 2>&1 || true
          done
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/errors.txt /tmp/compile.txt /tmp/tail.txt /tmp/sigs.txt .
          cp -r /tmp/gt gt
          echo "${{ steps.gametest.outcome }}" > gt/outcome.txt
          git add errors.txt tail.txt compile.txt sigs.txt gt
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: lumberassist-jar
          path: build/libs/
      - name: release notes
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          awk -v v="## $VER" '$0 ~ "^## " { if (p) exit; if (index($0, v) == 1) p = 1 } p' CHANGELOG.md > release-notes.md
          printf '\n---\nFabric 26.2용. 아래 jar 파일을 받아 mods 폴더에 넣으세요. (Fabric API 필요, Mod Menu 권장)\n' >> release-notes.md
      - name: release
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]') && steps.gametest.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumber Assist (build ${{ github.run_number }})
          body_path: release-notes.md
          files: build/libs/*.jar
